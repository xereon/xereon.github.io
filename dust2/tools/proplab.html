<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DUST II — Prop Lab</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#info{position:fixed;left:8px;top:6px;color:#fff;font:12px monospace;text-shadow:0 1px 2px #000;pointer-events:none;white-space:pre}</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas><div id="info"></div>
<script type="module">
// Prop lab: ?view=lineup|crates|crate|stack|door|car|prop&name=<factory>&args=<json>
//           &env=0|1  &exposure=1  &az=<deg> &el=<deg> &dist=<scale>  &labels=1
import * as THREE from 'three';
import * as Props from '../src/map/props.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'lineup';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +(q.get('exposure') || 1.0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
// sky gradient
const skyCv = document.createElement('canvas'); skyCv.width = 4; skyCv.height = 256;
{ const g = skyCv.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5f94c9'); gr.addColorStop(0.55, '#a9c6de'); gr.addColorStop(0.75, '#e6dccb'); gr.addColorStop(1, '#d9c7a6');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256); }
const skyTex = new THREE.CanvasTexture(skyCv); skyTex.colorSpace = THREE.SRGBColorSpace; skyTex.mapping = THREE.EquirectangularReflectionMapping;
scene.background = skyTex;
if (q.get('env') !== '0') {
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromEquirectangular(skyTex).texture;
  scene.environmentIntensity = +(q.get('envi') || 0.45);
}
scene.fog = new THREE.Fog(0xd8c8a8, 3000, 9000);
const sunDir = new THREE.Vector3(-0.5, -0.8, -0.3).normalize();
const sun = new THREE.DirectionalLight(0xfff0d0, +(q.get('sun') || 3));
const hemi = new THREE.HemisphereLight(0xbfd6ff, 0x8a6a45, +(q.get('hemi') || 1.0));
scene.add(sun, sun.target, hemi);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.6;

// sand floor
function sandTex() {
  const S = 512, d = new Uint8Array(S * S * 4);
  for (let i = 0; i < S * S; i++) { const n = Math.random() * 0.08 + Math.sin(i * 0.37) * 0.01; const k = 0.95 + n; d[i*4] = 205*k; d[i*4+1] = 184*k; d[i*4+2] = 146*k; d[i*4+3] = 255; }
  const t = new THREE.DataTexture(d, S, S); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40); t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.needsUpdate = true; return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshStandardMaterial({ map: sandTex(), roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 50), innerWidth / innerHeight, 1, 12000);
const stats = {};
const tris = (o) => { let t = 0, dc = 0; o.traverse((m) => { if (m.isMesh) { dc++; const g = m.geometry; t += (g.index ? g.index.count : g.attributes.position.count) / 3; } }); return { tris: Math.round(t), draws: dc }; };

function place(res, x, z, rot = 0, name) {
  const o = res.object || res;
  o.position.set(x, o.position.y, z); o.rotation.y = rot * Math.PI / 180;
  scene.add(o);
  if (name) stats[name] = { ...tris(o), colliders: (res.colliders || o.userData.colliders || []).length };
  return o;
}
function frameBox(box, az = 35, el = 22, scale = 1) {
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const r = s.length() * 0.5 + 1;
  const d = (r / Math.tan((camera.fov * Math.PI) / 360)) * 1.25 * scale;
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  camera.position.set(c.x + Math.sin(a) * Math.cos(e) * d, c.y + Math.sin(e) * d, c.z + Math.cos(a) * Math.cos(e) * d);
  camera.lookAt(c);
  return { c, r };
}
function shadowFit(c, r) {
  sun.position.copy(c).addScaledVector(sunDir, -Math.max(r * 3, 400)); sun.target.position.copy(c);
  const s = sun.shadow.camera; s.left = s.bottom = -r * 1.3; s.right = s.top = r * 1.3; s.near = 1; s.far = Math.max(r * 8, 1200); s.updateProjectionMatrix();
}

const az = +(q.get('az') ?? 35), el = +(q.get('el') ?? 22), dist = +(q.get('dist') || 1);
let focus = new THREE.Box3();
const sheet = [];
try {
  if (view === 'crate') {
    const o = place(Props.crate(+(q.get('size') || 64), +(q.get('variant') || 0)), 0, 0, 0, 'crate');
    focus.setFromObject(o);
  } else if (view === 'crates') {
    const sizes = [[32, 0], [48, 1], [64, 2], [64, 3], [96, 0], [128, 1], [64, 0], [64, 1]];
    let x = 0;
    sizes.forEach(([s, v], i) => { place(Props.crate(s, v), x + s / 2, 0, (i % 2) * 90, `crate${s}v${v}`); x += s + 24; });
    focus.set(new THREE.Vector3(0, 0, -64), new THREE.Vector3(x, 128, 64));
  } else if (view === 'stack') {
    const s = place(Props.crateStack(q.get('preset') || 'a_site'), 0, 0, 0, 'crateStack');
    focus.setFromObject(s);
  } else if (view === 'door') {
    const w = 112, h = 108, depth = 24;
    const wallM = new THREE.MeshStandardMaterial({ color: 0xd8cbb0, roughness: 0.95 });
    const W = 360, H = 180;
    for (const [x0, x1, y0, y1] of [[-W / 2, -w / 2, 0, H], [w / 2, W / 2, 0, H], [-w / 2, w / 2, h, H]]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, depth), wallM);
      m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0); m.castShadow = m.receiveShadow = true; scene.add(m);
    }
    place(Props.doubleDoor(w, h, +(q.get('open') || 0), { depth }), 0, 0, 0, 'doubleDoor');
    focus.set(new THREE.Vector3(-90, 0, -10), new THREE.Vector3(90, 120, 10));
  } else if (view === 'car') {
    const o = place(Props.car(+(q.get('variant') || 0)), 0, 0, 0, 'car');
    focus.setFromObject(o);
  } else if (view === 'sheet') {
    // names=crate|[64,1]~barrel|[2]~...  → one viewport cell per prop
    for (const [i, spec] of (q.get('names') || 'crate').split('~').entries()) {
      const [name, a] = spec.split('|');
      const o = place(Props[name](...(a ? JSON.parse(a) : [])), i * 50, 0, 0, name + ':' + i);
      let box = new THREE.Box3().setFromObject(o);
      if (box.min.y < -0.5) { o.position.y -= box.min.y; box = new THREE.Box3().setFromObject(o); } // wall-mounted props
      sheet.push({ o, name: spec.replace(/\|/g, ' '), box });
    }
    focus.set(new THREE.Vector3(-1, -1, -1), new THREE.Vector3(1, 1, 1));
  } else if (view === 'yard') {
    // showcase: every prop arranged in a courtyard, wall-mounted ones on a plaster wall
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const wallM = new THREE.MeshStandardMaterial({ color: 0xe0d6c2, roughness: 0.95 });
    const WZ = -320, WD = 24, WH = 230;
    const holes = [[-470, 112, 108], [-200, 128, 150], [390, 44, 60, 96]]; // [x, w, h, sill]
    const wallBox = (x0, x1, y0, y1) => { const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, WD), wallM); m.position.set((x0 + x1) / 2, (y0 + y1) / 2, WZ); m.castShadow = m.receiveShadow = true; scene.add(m); };
    let cx = -760;
    for (const [hx, hw, hh, sill = 0] of holes) {
      wallBox(cx, hx - hw / 2, 0, WH);
      if (sill) wallBox(hx - hw / 2, hx + hw / 2, 0, sill);
      wallBox(hx - hw / 2, hx + hw / 2, sill + hh, WH);
      cx = hx + hw / 2;
    }
    wallBox(cx, 760, 0, WH);
    const put = (res, x, y, z, rot = 0, name) => { const o = place(res, x, z, rot, name); o.position.y = y; return o; };
    const F = WZ + WD / 2; // wall front face
    put(Props.doubleDoor(112, 108, [0, 0.55], { depth: WD }), -470, 0, WZ, 0, 'doubleDoor');
    put(Props.awning(150, 40, { color: 'stripe' }), -470, 128, F, 0, 'awning');
    put(Props.bigDoorMetal(128, 150, 0, { arch: true, depth: WD }), -200, 0, WZ, 0, 'bigDoorMetal');
    put(Props.lamp(), -330, 150, F, 0, 'lamp');
    put(Props.shopShutter(100, 104), 90, 0, F, 0, 'shopShutter');
    put(Props.electricBox(), 225, 46, F, 0, 'electricBox');
    put(Props.meterBox(), 275, 58, F, 0, 'meterBox');
    put(Props.windowGrate(44, 60), 390, 96, F - 1.5, 0, 'windowGrate');
    put(Props.windowShutters(44, 60, 1, 'green'), 390, 96, F, 0, 'windowShutters');
    put(Props.acUnit(), 540, 120, F, 0, 'acUnit');
    put(Props.satelliteDish(), 650, 170, F, 0, 'satelliteDish');
    put(Props.hangingRope(56), -40, 150, F, 0, 'hangingRope');
    put(Props.ladder(150), 680, 0, F, 0, 'ladder');
    put(Props.woodenBeam(40, 8), 150, 150, F + 12, 90, 'woodenBeam');
    put(Props.archKeystone(), -200, 150 - 16, WZ, 0, 'archKeystone');
    // middle row
    const zM = -200;
    put(Props.crateStack('a_site'), -560, 0, zM, 0, 'crateStack');
    put(Props.tarpCrate(64, 'teal', 1), -380, 0, zM + 10, 12, 'tarpCrate');
    put(Props.slatCrate(56, 96, 56), -260, 0, zM - 20, 8, 'slatCrate');
    put(Props.metalCrate([96, 64, 64], 0), -110, 0, zM, -4, 'metalCrate');
    put(Props.tarp(56, 48, 44), 30, 0, zM, 6, 'tarp');
    put(Props.stoneBlocks(48, 40, 5), 130, 0, zM - 10, -8, 'stoneBlocks');
    put(Props.car(0), 330, 0, zM + 20, 200, 'car');
    put(Props.plankFence(160, 40), 560, 0, zM - 30, 0, 'plankFence');
    put(Props.palm(300, 0), -700, 0, zM + 40, 0, 'palm');
    put(Props.utilityPole(300), 720, 0, zM + 60, 90, 'utilityPole');
    put(Props.wireSpan(V(720 - 7.4, 292, zM + 60 - 30), V(560, 205, F + 2), 26), 0, 0, 0, 0, 'wireSpan');
    // front row
    const zF = -70;
    put(Props.crate(64, 0), -600, 0, zF, 20, 'crate64'); put(Props.crate(48, 1), -520, 0, zF + 20, -10, 'crate48'); put(Props.crate(32, 3), -470, 0, zF + 40, 35, 'crate32');
    put(Props.crate(64, 2), -410, 0, zF, 4, 'crate64v2');
    put(Props.barrel(0), -330, 0, zF, 0, 'barrel0'); put(Props.barrel(1), -302, 0, zF + 20, 40, 'barrel1'); put(Props.barrel(2), -272, 0, zF - 6, 80, 'barrel2');
    put(Props.urn(0), -225, 0, zF + 30); put(Props.urn(1), -200, 0, zF + 6); put(Props.urn(2), -170, 0, zF + 40, 0, 'urns');
    put(Props.jerrycan(0), -130, 0, zF + 30, 30, 'jerrycan'); put(Props.jerrycan(1), -112, 0, zF + 42, -20);
    put(Props.tyreStack(4), -70, 0, zF, 0, 'tyreStack'); put(Props.tire(true), -40, 0, zF + 30, 70, 'tire');
    put(Props.pallet(), 10, 0, zF + 10, 10, 'pallet');
    put(Props.sandbags(96, 3), 110, 0, zF + 30, -5, 'sandbags');
    put(Props.bench(56), 200, 0, zF + 40, 0, 'bench');
    put(Props.stoneBench(48), 280, 0, zF + 40, 0, 'stoneBench');
    put(Props.plant(0), 345, 0, zF + 30, 0, 'plant0'); put(Props.plant(1), 380, 0, zF + 55, 0, 'plant1'); put(Props.plant(2), 410, 0, zF + 25, 0, 'plant2');
    put(Props.rubble(40), 490, 0, zF + 40, 0, 'rubble');
    put(Props.pipe(V(560, 3, zF + 20), V(680, 3, zF + 40), 2.2), 0, 0, 0, 0, 'pipe');
    // instanced path (crates + barrels) behind the fence
    const inst = Props.instanced('crate', [{ x: 520, y: 0, z: -270, size: 32, variant: 0, rot: 10 }, { x: 560, y: 0, z: -275, size: 32, variant: 2, rot: -20 }, { x: 540, y: 32, z: -272, size: 32, variant: 1, rot: 45 }]);
    scene.add(inst); stats.instancedCrates = { ...tris(inst), colliders: inst.userData.colliders.length };
    const ib = Props.instanced('barrel', [{ x: 610, y: 0, z: -280 }, { x: 636, y: 0, z: -284, rot: 60 }, { x: 622, y: 0, z: -258, variant: 1 }]);
    scene.add(ib); stats.instancedBarrels = { ...tris(ib), colliders: ib.userData.colliders.length };
    focus.set(new THREE.Vector3(-760, 0, -320), new THREE.Vector3(760, 220, 0));
  } else if (view === 'prop') {
    const name = q.get('name');
    const args = JSON.parse(q.get('args') || '[]').map((a) => (Array.isArray(a) && a.length === 3 && q.get('vec') ? new THREE.Vector3(...a) : a));
    const o = place(Props[name](...args), 0, 0, 0, name);
    focus.setFromObject(o);
  } else {
    // lineup of everything
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const items = [
      ['crate', () => Props.crate(64, 0)], ['crate v1', () => Props.crate(48, 1)], ['crate v2', () => Props.crate(64, 2)], ['crate v3', () => Props.crate(32, 3)],
      ['crateStack', () => Props.crateStack('a_site')], ['tarpCrate', () => Props.tarpCrate?.(64)], ['barrel', () => Props.barrel(0)], ['barrel1', () => Props.barrel(1)],
      ['doubleDoor', () => Props.doubleDoor(112, 108, 0.35)], ['bigDoorMetal', () => Props.bigDoorMetal(128, 120)], ['lamp', () => Props.lamp()],
      ['awning', () => Props.awning(96, 40)], ['tarp', () => Props.tarp()], ['rubble', () => Props.rubble(40)], ['plant', () => Props.plant()],
      ['electricBox', () => Props.electricBox()], ['meterBox', () => Props.meterBox()], ['windowGrate', () => Props.windowGrate(40, 56)], ['palm', () => Props.palm()],
      ['car', () => Props.car()], ['ladder', () => Props.ladder(120)], ['bench', () => Props.bench()], ['sandbags', () => Props.sandbags(96)],
      ['stoneBench', () => Props.stoneBench()], ['woodenBeam', () => Props.woodenBeam(96)], ['hangingRope', () => Props.hangingRope()], ['jerrycan', () => Props.jerrycan()],
      ['pallet', () => Props.pallet()], ['tire', () => Props.tire()], ['tyreStack', () => Props.tyreStack(4)], ['metalCrate', () => Props.metalCrate()],
      ['archKeystone', () => Props.archKeystone()], ['satelliteDish', () => Props.satelliteDish()], ['utilityPole', () => Props.utilityPole()],
      ['shopShutter', () => Props.shopShutter(96, 100)], ['windowShutters', () => Props.windowShutters(40, 60)], ['acUnit', () => Props.acUnit()], ['urn', () => Props.urn()],
      ['slatCrate', () => Props.slatCrate()], ['plankFence', () => Props.plankFence(128)], ['stoneBlocks', () => Props.stoneBlocks()],
      ['wireSpan', () => Props.wireSpan(V(0, 150, 0), V(160, 140, 0), 20)], ['pipe', () => Props.pipe(V(0, 4, 0), V(96, 4, 0), 2)],
    ];
    const cols = +(q.get('cols') || 8), sp = +(q.get('sp') || 170);
    let i = 0;
    for (const [name, fn] of items) {
      let r = null;
      try { r = fn(); } catch (e) { console.warn('lineup skip', name, e.message); }
      if (!r) { i++; continue; }
      const x = (i % cols) * sp, z = Math.floor(i / cols) * sp;
      const o = place(r, x, z, 0, name);
      if (name === 'wireSpan' || name === 'pipe') o.position.set(x - 60, 0, z);
      if (q.get('labels')) {
        const cv = document.createElement('canvas'); cv.width = 256; cv.height = 40; const g = cv.getContext('2d');
        g.fillStyle = '#000'; g.font = 'bold 26px monospace'; g.fillText(name, 4, 30);
        const t = new THREE.CanvasTexture(cv); const sp2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
        sp2.scale.set(64, 10, 1); sp2.position.set(x, -2, z + 60); scene.add(sp2);
      }
      i++;
    }
    const rows = Math.ceil(i / cols);
    focus.set(new THREE.Vector3(-60, 0, -60), new THREE.Vector3((cols - 1) * sp + 60, 150, (rows - 1) * sp + 60));
  }
} catch (e) { console.error('lab build failed', e); }

let fr = frameBox(focus, az, el, dist);
if (view === 'yard' && !q.get('az')) {
  // full yard, or a closer left/right half (&half=L|R)
  const hx = q.get('half') === 'L' ? -400 : q.get('half') === 'R' ? 400 : 0, near = q.get('half') ? 0.62 : 1;
  camera.fov = q.get('half') ? 50 : 62; camera.updateProjectionMatrix();
  camera.position.set(hx, 190 * near + 20, -150 + 600 * near); camera.lookAt(hx, 55, -190);
  fr = { c: new THREE.Vector3(0, 60, -160), r: 820 };
}
shadowFit(fr.c, fr.r);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__STATS = stats;
let n = 0;
function renderSheet() {
  const W = innerWidth, H = innerHeight, N = sheet.length;
  const cols = +(q.get('cols') || Math.ceil(Math.sqrt(N * 1.3))), rows = Math.ceil(N / cols);
  const cw = Math.floor(W / cols), ch = Math.floor(H / rows);
  renderer.setScissorTest(true);
  sheet.forEach((c, i) => {
    const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
    for (const d of sheet) d.o.visible = d === c;
    camera.aspect = cw / ch; camera.updateProjectionMatrix();
    const fr = frameBox(c.box, az, el, dist); shadowFit(fr.c, fr.r);
    renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
    renderer.render(scene, camera);
  });
  renderer.setScissorTest(false);
  if (!document.getElementById('lbl0')) sheet.forEach((c, i) => {
    const d = document.createElement('div'); d.id = 'lbl' + i; d.textContent = c.name;
    d.style.cssText = `position:fixed;left:${(i % cols) * cw + 6}px;top:${Math.floor(i / cols) * ch + 4}px;color:#111;font:bold 13px monospace;background:#fff8;padding:1px 4px`;
    document.body.appendChild(d);
  });
}
function loop() {
  if (sheet.length) renderSheet(); else renderer.render(scene, camera);
  if (++n === 3) { window.__READY = true; window.__INFO = renderer.info.render; }
  requestAnimationFrame(loop);
}
loop();
document.getElementById('info').textContent = q.get('hud') ? JSON.stringify(stats) : '';
</script>
</body>
</html>
